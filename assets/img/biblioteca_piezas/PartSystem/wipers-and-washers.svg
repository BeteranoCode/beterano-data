<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#ffffff"/>
  <g fill="none" stroke="#111111" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Windshield arc guide -->
    <path d="M140 780 Q512 200 884 780" stroke-dasharray="18 24" stroke-width="18"/>
    <!-- Wiper pivot point -->
    <circle cx="512" cy="820" r="30" fill="#111111"/>
    <!-- Wiper arm (angled up-right) -->
    <path d="M512 820 L780 380"/>
    <!-- Wiper blade at end of arm -->
    <path d="M700 320 L850 460" stroke-width="40"/>
    <!-- Blade holder (small parallel) -->
    <path d="M720 340 L830 440" stroke-width="14"/>
    <!-- Sweep arc showing motion -->
    <path d="M280 640 Q320 420 540 340" stroke-dasharray="14 18" stroke-width="18"/>
    <path d="M340 720 Q400 500 620 400" stroke-dasharray="14 18" stroke-width="18"/>
    <!-- Water spray droplets (nozzle jets) -->
    <g fill="#111111">
      <circle cx="380" cy="260" r="14"/>
      <circle cx="440" cy="220" r="12"/>
      <circle cx="500" cy="200" r="14"/>
      <circle cx="560" cy="210" r="12"/>
      <circle cx="620" cy="240" r="14"/>
    </g>
  </g>
</svg>
